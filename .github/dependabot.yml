version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      build-and-test:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@playwright/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
