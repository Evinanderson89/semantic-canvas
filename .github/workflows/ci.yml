name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run e2e

      - run: docker build -t semantic-canvas:company-preview .

      - run: node scripts/docker-smoke.mjs
