name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - name: Start app
        run: npm start &

      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 http://localhost:5174/api/model --timeout 60000

      - run: npm run e2e
