# Data sources.
#
# A source pairs a SEMANTIC ADAPTER (what the model is written in) with a
# CONNECTOR (where the SQL runs). They are independent axes: a dbt project can
# sit on DuckDB, and a duckglue model can sit on Snowflake.
#
# Everything downstream -- compiler, canvas, row-level security, cache -- is
# source-agnostic, so adding a warehouse is config, not code.

defaultPrincipal: admin      # who the UI acts as before anyone picks

# The embedded in-app agent (the chat panel, not the MCP port below) -- a
# pluggable port like a data source is: provider + model here, credential
# from .env. Present by default so it works the moment ANTHROPIC_API_KEY is
# set; with no key it just reports itself unavailable, same as a source that
# fails to connect.
ai:
  provider: anthropic
  model: claude-opus-5
  apiKey: ${ANTHROPIC_API_KEY}

sources:
  # The "Sample Warehouse" every quickstart runs against. Its model and data
  # ship IN this repo, under sample-data/ -- resolved relative to wherever
  # `npm start`/`npm run server` is actually launched from (the repo root,
  # normally), same as SOURCES_PATH/RLS_PATH in .env.example. Generated by
  # duckglue (a separate project, not bundled here); regenerate by pointing
  # this at your own duckglue checkout's output instead if you want to
  # extend the sample data rather than just read it.
  - id: duckglue-local
    label: duckglue on DuckDB
    adapter: duckglue
    model: ./sample-data/warehouse.yaml
    connector:
      type: duckdb
      lakeRoot: ./sample-data/lake
      poolSize: 4

  # Uncomment and fill in to attach a warehouse. A source that fails to connect
  # is reported as unavailable; it does not take the others down with it.
  #
  # Credentials referenced as ${VAR} below come from .env (copy .env.example
  # to .env and fill in the SNOWFLAKE_* values) -- nothing here should hold a
  # secret directly.
  # - id: dbt-snowflake
  #   label: dbt on Snowflake
  #   adapter: dbt
  #   model: ~/analytics/target          # directory holding the dbt manifests
  #   connector:
  #     type: snowflake
  #     account: ${SNOWFLAKE_ACCOUNT}
  #     username: ${SNOWFLAKE_USER}
  #     privateKey: ${SNOWFLAKE_PRIVATE_KEY}
  #     role: ANALYTICS_READER
  #     warehouse: COMPUTE_WH
  #     database: ANALYTICS
  #     schema: MARTS
  #     poolSize: 6
